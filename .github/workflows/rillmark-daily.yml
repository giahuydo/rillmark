name: Rillmark daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry run fetches Zendesk without calling OpenAI; sync requires configured credentials"
        type: choice
        options:
          - dry-run
          - sync
        default: dry-run

permissions:
  contents: read

concurrency:
  group: rillmark-sync
  cancel-in-progress: false

jobs:
  run:
    if: ${{ (github.event_name == 'schedule' && vars.RILLMARK_SCHEDULE_ENABLED == 'true') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t rillmark-job .
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        run: |
          docker create --name rillmark-run -e GIT_SHA="$GITHUB_SHA" rillmark-job main.py --dry-run
          docker start --attach rillmark-run
      - name: Live sync
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync') }}
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARTIFACT_GITHUB_TOKEN: ${{ secrets.ARTIFACT_GITHUB_TOKEN }}
          ARTIFACT_GIST_ID: ${{ vars.ARTIFACT_GIST_ID }}
          VECTOR_STORE_ID: ${{ vars.VECTOR_STORE_ID }}
          REQUIRE_PUBLISH: 'true'
        run: |
          for key in API_KEY ARTIFACT_GITHUB_TOKEN ARTIFACT_GIST_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Required configuration missing: $key"
              exit 1
            fi
          done
          docker create --name rillmark-run \
            -e API_KEY -e ARTIFACT_GITHUB_TOKEN -e ARTIFACT_GIST_ID \
            -e VECTOR_STORE_ID -e REQUIRE_PUBLISH -e GIT_SHA="$GITHUB_SHA" \
            rillmark-job
          docker start --attach rillmark-run
      - name: Collect container report
        if: ${{ always() }}
        run: |
          rm -f last_run.json
          if docker container inspect rillmark-run >/dev/null 2>&1; then
            docker cp rillmark-run:/app/last_run.json last_run.json || echo "::warning::No container report available"
            docker rm -f rillmark-run
          fi
      - name: Upload redacted run artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: last-run
          path: last_run.json
          if-no-files-found: warn
